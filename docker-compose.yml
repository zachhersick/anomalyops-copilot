services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anomalyops-copilot-api
    environment:
      ANOMALYOPS_RETRIEVAL_BACKEND: manifest
      ANOMALYOPS_MANIFEST_PATH: /app/outputs/chunks.json
      ANOMALYOPS_AI_PROVIDER: deterministic
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: anomalyops-postgres
    environment:
      POSTGRES_USER: anomalyops
      POSTGRES_PASSWORD: anomalyops
      POSTGRES_DB: anomalyops
    ports:
      - "5432:5432"
    volumes:
      - anomalyops_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  anomalyops_postgres_data: